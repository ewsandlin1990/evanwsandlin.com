# Refreshes the "Recently watched" films on the More page once a day.
# Can also be run by hand: GitHub > Actions > "Update Letterboxd" > Run workflow.
name: Update Letterboxd

on:
  schedule:
    - cron: "17 9 * * *"     # every day at 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch feed and rebuild the section
        run: python3 scripts/update_letterboxd.py
      - name: Commit if anything changed
        run: |
          git config user.name "letterboxd-updater"
          git config user.email "actions@users.noreply.github.com"
          git add more/index.html
          git diff --cached --quiet || (git commit -m "Update recently watched films" && git push)
